name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android Platform and Permissions
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Detectar arquivo de ícone (Icon.png ou icon.png)
          ICON_SOURCE=""
          if [ -s "public/Icon.png" ]; then
            ICON_SOURCE="public/Icon.png"
          elif [ -s "public/icon.png" ]; then
            ICON_SOURCE="public/icon.png"
          fi

          if [ ! -z "$ICON_SOURCE" ]; then
            echo "Gerando ícones a partir de $ICON_SOURCE..."
            npm install @capacitor/assets --save-dev --legacy-peer-deps
            # Criar estrutura padrão que o gerador gosta
            mkdir -p assets
            cp "$ICON_SOURCE" assets/icon.png
            cp "$ICON_SOURCE" assets/icon-only.png
            cp "$ICON_SOURCE" assets/icon-foreground.png
            cp "$ICON_SOURCE" assets/icon-background.png
            cp "$ICON_SOURCE" assets/splash.png
            cp "$ICON_SOURCE" assets/splash-dark.png
            cp "$ICON_SOURCE" assets/logo.png
            # Gerar sem flags de arquivo específicas para evitar erros de versão
            npx @capacitor/assets generate --android
          fi

          # Injetar permissões de GPS e Clipboard no AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            echo "Permissões já existem"
          else
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_CLIPBOARD" />\n    <uses-feature android:name="android.hardware.location.gps" />' "$MANIFEST"
          fi
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          # Ajustes para estabilidade do build e memória
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
